task: mixed_pass1
dataset_path: json
dataset_kwargs:
  data_files:
    train: data/mixed_10.jsonl
output_type: generate_until
test_split: train
doc_to_text: "{{instruction}}\n{{input}}"
doc_to_target: "{{output}}"
repeats: 1
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
generation_kwargs:
  until:
    - "<|im_end|>"
    - "<|endoftext|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 32768
filter_list:
  - name: "extract_boxed_answer"
    filter:
      - function: "regex"
        regex_pattern: "\\\\boxed\\{([^}]*)\\}"
      - function: "take_first"
