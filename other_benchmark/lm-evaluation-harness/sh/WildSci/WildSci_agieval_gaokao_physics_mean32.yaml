task: WildSci_agieval_gaokao_physics_mean32
dataset_path: hails/agieval-gaokao-physics
output_type: generate_until
test_split: test
doc_to_text: !function utils.doc_to_mc_text
doc_to_target: !function utils.doc_to_choice_target
process_results: !function utils.process_choice_mean32
repeats: 32
num_fewshot: 0
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "Question:"
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: true
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  max_gen_toks: 4096
filter_list:
  - name: mean32
    filter:
      - function: take_first_k
        k: 32
metadata:
  version: 1.0
